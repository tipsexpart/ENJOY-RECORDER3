name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Ensure Gradle Wrapper, Properties & Version Catalog Exist
        run: |
          mkdir -p gradle/wrapper
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          networkTimeout=60000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -sSL --retry 3 -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar" || true
          fi
          if [ ! -f "gradle/libs.versions.toml" ]; then
            echo "Generating gradle/libs.versions.toml catalog..."
            cat << 'EOF' > gradle/libs.versions.toml
          [versions]
          agp = "8.7.3"
          kotlin = "2.0.21"
          coreKtx = "1.15.0"
          lifecycleRuntimeKtx = "2.8.7"
          activityCompose = "1.9.3"
          composeBom = "2024.12.01"
          camera = "1.4.1"
          playServicesAds = "23.6.0"

          [libraries]
          androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
          androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
          androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
          androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
          androidx-ui = { group = "androidx.compose.ui", name = "ui" }
          androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
          androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
          androidx-material3 = { group = "androidx.compose.material3", name = "material3" }

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
          compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
          EOF
          fi
          # Accept Android SDK Licenses & Fix Line Endings
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" 2>/dev/null || true
          if [ -f "gradlew" ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
          fi

      - name: Build Debug APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon --no-build-cache
          else
            gradle assembleDebug --stacktrace --no-daemon --no-build-cache
          fi

      - name: Find & Prepare APK Files
        run: |
          echo "Searching for generated APK files..."
          mkdir -p release_output
          find . -type f -name "*.apk" -exec cp -v {} release_output/ \; || true
          echo "Files ready for artifact upload:"
          ls -lah release_output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enjoy-recorder-debug-apk
          path: |
            release_output/*.apk
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
